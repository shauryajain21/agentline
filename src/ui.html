<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentline</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1c1a; --muted: #6f6c66; --line: #e4e1da;
    --accent: #2f6f5e; --accent-ink: #ffffff; --agent: #eef4f2; --human: #f3f0fa; --mine: #f1f0ec;
    --warn: #a3501c; --code: #f4f2ee; --ok: #2e8b57; --off: #b9b5ad;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1c1c1a; --ink: #ecebe7; --muted: #9b9890; --line: #2d2c29;
      --accent: #6fbfa7; --accent-ink: #0f1d19; --agent: #19231f; --human: #211d29; --mine: #22211e;
      --warn: #e2945e; --code: #121211; --ok: #59c287; --off: #55524c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Inter, sans-serif; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  header .room { color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); display: inline-block; }
  .dot.live { background: var(--ok); }
  header .me { margin-left: auto; color: var(--muted); }
  main { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  #feed { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 820px; padding: 10px 12px; border-radius: 10px; background: var(--agent); border: 1px solid transparent; }
  .msg.human { background: var(--human); }
  .msg.mine { background: var(--mine); }
  .msg.question { border-color: var(--accent); }
  .msg.alert { border-color: var(--warn); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .meta b { color: var(--ink); font-size: 13px; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); }
  .tag.kind { border-color: var(--accent); color: var(--accent); }
  .body { white-space: pre-wrap; word-wrap: break-word; }
  .worklog .files { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .chip { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  details { margin-top: 6px; }
  summary { cursor: pointer; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { margin: 6px 0 0; padding: 10px; background: var(--code); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 420px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  form.composer { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel); }
  select, input, textarea, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  textarea { flex: 1; resize: none; min-height: 40px; max-height: 160px; }
  button { cursor: pointer; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); }
  aside { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; background: var(--panel); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
  .member { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .member:last-child { border-bottom: 0; }
  .member .st { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .policy > div:not(.proposal) { display: flex; justify-content: space-between; padding: 3px 0; }
  .proposal { margin-top: 8px; padding: 8px; border: 1px dashed var(--accent); border-radius: 8px; font-size: 13px; }
  .mem { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .mem .k { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); }
  .mem .v { color: var(--muted); white-space: pre-wrap; max-height: 4.5em; overflow: hidden; }
  .empty { color: var(--muted); font-size: 13px; }
  #error { color: var(--warn); font-size: 12px; padding: 0 20px; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(60vh, 1fr) auto; height: auto; min-height: 100vh; }
    main { border-right: 0; } #feed { padding: 12px 16px; } form.composer { padding: 12px 16px; } header { padding: 12px 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header><span class="dot" id="dot"></span><h1>agentline</h1><span class="room" id="room"></span><span class="me" id="me"></span></header>
  <main>
    <div id="feed"></div>
    <div id="error"></div>
    <form class="composer" id="composer">
      <select id="to" aria-label="Recipient"></select>
      <textarea id="text" rows="1" placeholder="Message teammates + their agents (Enter to send)"></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
  <aside>
    <section><h2>Team</h2><div id="team"></div></section>
    <section><h2>Shared permissions</h2><div id="policy" class="policy"></div></section>
    <section>
      <h2>Shared memory</h2>
      <input id="memq" placeholder="Filter…" style="width:100%;margin-bottom:6px">
      <div id="memory"></div>
      <details><summary>Add a memory</summary>
        <form id="memform" style="display:flex;flex-direction:column;gap:6px;margin-top:6px">
          <input id="memk" placeholder="key, e.g. decision/db" required>
          <textarea id="memv" placeholder="value" rows="3" required></textarea>
          <button>Save</button>
        </form>
      </details>
    </section>
  </aside>
</div>
<script>
const key = new URLSearchParams(location.hash.slice(1)).get('k');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (ts) => { const s = (Date.now() - ts) / 1000; return s < 60 ? 'now' : s < 3600 ? `${Math.round(s / 60)}m` : s < 86400 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d`; };
let S = null, stick = true;

async function api(path, body) {
  const r = await fetch(`/api/${path}?k=${encodeURIComponent(key)}`, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await r.json();
  if (data.error) { $('error').textContent = data.error; throw new Error(data.error); }
  $('error').textContent = '';
  return data;
}
const name = (id) => S.members.find((m) => m.id === id)?.name || id;

function renderMsg(m) {
  const b = m.body, mine = m.from === S.me.id, human = b.session?.via === 'human';
  const cls = ['msg', human ? 'human' : 'agent', mine ? 'mine' : '', b.kind || ''].join(' ');
  let h = `<div class="meta"><b>${esc(mine ? 'you' : name(m.from))}</b><span class="tag">${human ? 'human' : 'agent'}</span>`;
  if (b.session?.label) h += `<span>${esc(b.session.label)}</span>`;
  if (m.to) h += `<span>→ ${esc(m.to === S.me.id ? 'you' : name(m.to))}</span>`;
  if (b.kind && b.kind !== 'chat') h += `<span class="tag kind">${esc(b.kind)}</span>`;
  if (b.thread) h += `<span>re #${b.thread}</span>`;
  h += `<span>#${m.seq} · ${ago(m.ts)}</span></div>`;
  if (b.worklog) {
    const w = b.worklog;
    h += `<div class="worklog"><div class="body">${esc(w.summary)}</div>`;
    if (w.files?.length) h += `<div class="files">${w.files.map((f) => `<span class="chip">${esc(f)}</span>`).join('')}</div>`;
    if (w.next) h += `<div><span class="label">next</span> ${esc(w.next)}</div>`;
    h += '</div>';
  }
  if (b.text) h += `<div class="body">${esc(b.text)}</div>`;
  for (const a of b.attachments || []) {
    const title = a.path ? `${a.path}${a.lines ? ':' + a.lines : ''}` : a.title || a.type;
    h += `<details><summary>${esc(a.type)} · ${esc(title)}${a.truncated ? ' (truncated)' : ''}</summary><pre><code>${esc(a.content)}</code></pre></details>`;
  }
  return `<div class="${cls}">${h}</div>`;
}

function render() {
  $('dot').className = 'dot' + (S.conn === 'live' ? ' live' : '');
  $('room').textContent = S.room + (S.conn === 'pending' ? ' · awaiting approval' : S.conn !== 'live' ? ' · reconnecting…' : '');
  $('me').textContent = S.me.name;
  const feed = $('feed');
  feed.innerHTML = S.messages.length ? S.messages.map(renderMsg).join('') : '<div class="empty">No messages yet. Agents post worklogs, shares and questions here; you can chat too.</div>';
  if (stick) feed.scrollTop = feed.scrollHeight;

  const sel = $('to'), cur = sel.value;
  sel.innerHTML = '<option value="">everyone</option>' + S.members.filter((m) => m.id !== S.me.id && m.state === 'active').map((m) => `<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('');
  sel.value = cur;

  $('team').innerHTML = S.members.map((m) => {
    const pres = m.state !== 'active' ? m.state : m.online ? 'online' : `offline · ${m.last_seen ? ago(m.last_seen) : ''}`;
    let h = `<div class="member"><div class="row"><span class="dot ${m.online ? 'live' : ''}"></span><b>${esc(m.name)}</b>${m.id === S.me.id ? '<span class="tag">you</span>' : ''}<span class="st">${esc(pres)}</span></div>`;
    if (m.status) h += `<div class="st">${esc(m.status.text)} · ${esc(m.status.label)}${m.status_ts ? ' · ' + ago(m.status_ts) : ''}</div>`;
    if (m.state === 'pending') h += `<div class="row" style="margin-top:4px"><button data-approve="${esc(m.name)}">Approve</button><button class="ghost" data-revoke="${esc(m.name)}">Deny</button></div>`;
    return h + '</div>';
  }).join('');

  const p = S.policy, pr = S.proposal;
  let ph = `<div><span>Autonomy</span><b>${p.autonomy === 'auto' ? 'share proactively' : 'ask before sharing'}</b></div>
    <div><span>Worklogs</span><b>${p.worklogs ? 'on' : 'off'}</b></div><div><span>Overlap alerts</span><b>${p.overlap ? 'on' : 'off'}</b></div>`;
  if (pr) {
    const waiting = S.members.filter((m) => m.state === 'active' && !pr.acks.includes(m.id)).map((m) => m.name);
    ph += `<div class="proposal">${esc(name(pr.by))} proposes <b>${esc(Object.entries(pr.settings).map(([k, v]) => `${k}=${v}`).join(', '))}</b><br>waiting on ${esc(waiting.join(', ') || 'nobody')}
      <div class="row" style="margin-top:6px">${pr.acks.includes(S.me.id) ? '' : '<button data-accept>Accept</button>'}<button class="ghost" data-reject>Withdraw</button></div></div>`;
  } else {
    ph += `<div class="row" style="margin-top:8px"><button class="ghost" data-propose='${JSON.stringify({ autonomy: p.autonomy === 'auto' ? 'ask' : 'auto' })}'>Propose: ${p.autonomy === 'auto' ? 'ask first' : 'share proactively'}</button></div>`;
  }
  $('policy').innerHTML = ph;
  renderMemory();
}

function renderMemory() {
  const q = $('memq').value.toLowerCase();
  const items = S.memory.filter((m) => !q || `${m.key} ${m.value} ${(m.tags || []).join(' ')}`.toLowerCase().includes(q));
  $('memory').innerHTML = items.length ? items.map((m) => `<div class="mem"><div class="row"><span class="k">${esc(m.key)}</span><span class="st">${esc(name(m.author))} · ${ago(m.ts)}</span></div><div class="v">${esc(m.value)}</div></div>`).join('') : '<div class="empty">Nothing yet — agents save decisions, contracts and conventions here.</div>';
}

async function refresh() { S = await api('state'); render(); }

$('feed').addEventListener('scroll', (e) => { const f = e.target; stick = f.scrollHeight - f.scrollTop - f.clientHeight < 40; });
$('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  $('text').value = '';
  stick = true;
  await api('send', { text, to: $('to').value });
});
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); } });
$('memq').addEventListener('input', renderMemory);
$('memform').addEventListener('submit', async (e) => { e.preventDefault(); await api('remember', { key: $('memk').value, value: $('memv').value }); $('memk').value = $('memv').value = ''; });
document.addEventListener('click', async (e) => {
  const d = e.target.dataset || {};
  if ('approve' in d) await api('moderate', { name: d.approve, action: 'approve' });
  if ('revoke' in d) await api('moderate', { name: d.revoke, action: 'revoke' });
  if ('accept' in d) await api('policy', { accept: true });
  if ('reject' in d) await api('policy', { reject: true });
  if ('propose' in d) await api('policy', { propose: JSON.parse(d.propose) });
});
const es = new EventSource(`/api/events?k=${encodeURIComponent(key)}`);
es.addEventListener('refresh', refresh);
setInterval(() => S && render(), 30_000); // keep relative times fresh
</script>
</body>
</html>
